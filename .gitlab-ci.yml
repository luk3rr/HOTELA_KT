include:
  - project: 'personal/projects/infrastructure-lives'
    file: '/template/pipeline.yml'
    ref: main

variables:
  SERVICE_NAME: "hotela"
  SERVICE_GROUP: "personal/projects"
  PROJECT_NAME: "HOTELA_KT"
  DEPLOY_MANIFEST_PATH: "k8s/deployment.yml"
  BUILD_CACHE_PATH: "/cache/.gradle"

cache:
  paths:
    - /cache/.gradle/wrapper/
    - /cache/.gradle/caches/

stages:
  - test
  - build
  - deploy

unit_test:
  stage: test
  image: gradle:8-jdk21
  script:
    - ./gradlew -g $BUILD_CACHE_PATH --build-cache build jacocoTestReport
  artifacts:
    paths:
      - build
  cache:
    paths:
      - $BUILD_CACHE_PATH
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_MERGE_REQUEST_ID'
      when: always
    - when: never
      allow_failure: false

deploy_postgres:
  stage: deploy
  image:
    name: lachlanevenson/k8s-kubectl:latest
    entrypoint: [""]
  before_script:
    - echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
    - apk add --no-cache curl jq gettext
  script:
    - kubectl apply -f k8s/postgres.yml
    - |
      echo "Waiting for Postgres pod to be ready..."
      for i in $(seq 1 10); do
        POD=$(kubectl get pods -n $SERVICE_NAME -l app=postgres -o jsonpath="{.items[0].metadata.name}")
        STATUS=$(kubectl get pod "$POD" -n $SERVICE_NAME -o jsonpath="{.status.phase}")
        READY=$(kubectl get pod "$POD" -n $SERVICE_NAME -o jsonpath="{.status.containerStatuses[0].ready}")
        if [[ "$STATUS" == "Running" && "$READY" == "true" ]]; then
          echo "Database pod is ready: $POD"
          exit 0
        fi
        echo "Waiting for Postgres pod to be ready... (attempt $i)"
        sleep 5
      done
      echo "Timeout waiting for Postgres pod to be ready."
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
