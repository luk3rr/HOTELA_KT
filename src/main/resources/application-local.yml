spring:
  application:
    name: hotela

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/hotela
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    url: jdbc:postgresql://localhost:5432/hotela
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

logging:
  level:
    liquibase: DEBUG

security:
  key: ${JWT_SECRET}