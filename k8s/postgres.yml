apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hotela
  namespace: hotela
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app-role"
        vault.hashicorp.com/agent-inject-secret-hotela-env: 'kv/data/app/hotela'
        vault.hashicorp.com/agent-inject-template-hotela-env: |
          {{- with secret "kv/data/app/hotela" }}
            export POSTGRES_USER="{{ .Data.data.DB_USER }}"
            export POSTGRES_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          {{- end }}
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: postgres
          image: postgres:latest
          command: [ "/bin/bash", "-c" ]
          args:
            - |
              retries=0
              max_retries=30
              
              echo "Waiting for secrets to be injected from Vault..."
              
              while [ ! -f /vault/secrets/hotela-env ]; do
                if [ $retries -ge $max_retries ]; then
                  echo "ERROR: Timed out after $(($max_retries * 2)) seconds waiting for Vault secret file."
                  exit 1
                fi
                retries=$((retries + 1))
                echo "Waiting... attempt ${retries}/${max_retries}"
                sleep 2
              done
              
              echo "Secrets found. Sourcing environment variables."
              
              source /vault/secrets/hotela-env
              
              exec docker-entrypoint.sh postgres
          env:
            - name: POSTGRES_DB
              value: hotela
            - name: TZ
              value: UTC
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: hotela
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: vault
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30543