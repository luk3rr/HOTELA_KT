apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotela
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: hotela
  template:
    metadata:
      labels:
        app: hotela
    spec:
      containers:
        - name: hotela
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: hotela-secret
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hotela-service
spec:
  type: NodePort
  selector:
    app: hotela
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
