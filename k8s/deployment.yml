apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: hotela
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotela
  namespace: hotela
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: hotela
  template:
    metadata:
      labels:
        app: hotela
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/exit-on-complete: 'true'
        vault.hashicorp.com/role: 'app-hotela'
        vault.hashicorp.com/agent-inject-secret-app-env: 'kv/data/app/hotela'
        vault.hashicorp.com/agent-inject-template-app-env: |
          {{ with secret "kv/data/app/hotela" }}
          {{ range $key, $val := .Data.data }}
            export {{ $key }}="{{ $val }}"
          {{ end }}
          {{ end }}
        vault.hashicorp.com/agent-inject-secret-db-creds: 'database/creds/app-hotela'
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{ with secret "database/creds/app-hotela" }}
            export DB_USERNAME="{{ .Data.username }}"
            export DB_PASSWORD="{{ .Data.password }}"
          {{ end }}
    spec:
      serviceAccountName: vault-auth
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: vault
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: hotela
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "postgres.luk3rr.com."
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Waiting for Vault secrets..."

              retries=0
              max_retries=30
              
              while [ ! -f /vault/secrets/app-env ] || [ ! -f /vault/secrets/db-creds ]; do
                if [ $retries -ge $max_retries ]; then
                  echo "ERROR: Timed out waiting for Vault secrets"
                  exit 1
                fi
                retries=$((retries + 1))
                echo "Waiting... attempt ${retries}/${max_retries}"
                sleep 2
              done

              echo "Secrets received. Starting application..."

              set -a
              source /vault/secrets/app-env
              source /vault/secrets/db-creds
              set +a

              java -jar /app/app.jar
